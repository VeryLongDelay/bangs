name: Update Bang List

on:
  # Run at 00:00 UTC on the 1st of every month
  schedule:
    - cron: "0 0 * * *"

  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  update-bangs:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update bangs from DuckDuckGo and Kagi
        run: bun run scripts/update-bangs.js

      - name: Check for changes
        id: diff
        run: |
          git add data/bangs.json bangs.json.sha256
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update bangs"
          git push

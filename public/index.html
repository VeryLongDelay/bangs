<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Search bangs from a local static dataset." />
    <title>Bang Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
    :root {
      color-scheme: dark light;
      --font-body: "IBM Plex Sans", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --bg: #0f172a;
      --bg-accent: radial-gradient(
        ellipse 80% 50% at 50% -20%,
        rgba(34, 197, 94, 0.12),
        transparent 70%
      );
      --surface: #1e293b;
      --surface-raised: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;
      --border: rgba(248, 250, 252, 0.1);
      --border-strong: rgba(248, 250, 252, 0.16);
      --accent: #22c55e;
      --accent-glow: rgba(34, 197, 94, 0.35);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 4px 24px rgba(0, 0, 0, 0.35);
      --shadow-search: 0 0 0 1px var(--border), 0 8px 32px rgba(0, 0, 0, 0.4);
      --radius: 0.75rem;
      --radius-sm: 0.5rem;
      --transition: 200ms ease;
      --active-keycap: var(--accent);
      --max-width: 52rem;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --bg-accent: radial-gradient(
          ellipse 80% 50% at 50% -20%,
          rgba(34, 197, 94, 0.08),
          transparent 70%
        );
        --surface: #ffffff;
        --surface-raised: #f1f5f9;
        --text: #0f172a;
        --text-muted: #475569;
        --text-subtle: #64748b;
        --border: #e2e8f0;
        --border-strong: #cbd5e1;
        --accent-glow: rgba(34, 197, 94, 0.2);
        --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
        --shadow-md: 0 4px 24px rgba(15, 23, 42, 0.08);
        --shadow-search: 0 0 0 1px var(--border), 0 8px 32px rgba(15, 23, 42, 0.06);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms;
        animation-iteration-count: 1;
        transition-duration: 0.01ms;
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      padding: clamp(1.25rem, 4vw, 2.5rem);
      font-family: var(--font-body);
      font-size: 1rem;
      line-height: 1.5;
      background-color: var(--bg);
      background-image: var(--bg-accent);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: var(--max-width);
      margin: 0 auto;
    }

    .hero {
      margin-bottom: 2rem;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin: 0 0 0.75rem;
      padding: 0.25rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 10%, transparent);
    }

    .eyebrow svg {
      width: 0.85rem;
      height: 0.85rem;
      flex-shrink: 0;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-family: var(--font-mono);
      font-size: clamp(1.75rem, 5vw, 2.25rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    .meta {
      margin: 0;
      font-size: 0.9375rem;
      color: var(--text-muted);
    }

    .meta.is-loading {
      color: var(--text-subtle);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    .search-shell {
      position: relative;
      display: flex;
      align-items: center;
      margin-top: 1.75rem;
    }

    #bang-search {
      width: 100%;
      padding: 1rem 11.5rem 1rem 1.125rem;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      font-family: var(--font-mono);
      font-size: 1rem;
      font-weight: 500;
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-search);
      transition:
        border-color var(--transition),
        box-shadow var(--transition);
    }

    #bang-search::placeholder {
      color: var(--text-subtle);
      font-weight: 400;
    }

    #bang-search:hover {
      border-color: color-mix(in srgb, var(--accent) 40%, var(--border-strong));
    }

    #bang-search:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow:
        var(--shadow-search),
        0 0 0 3px var(--accent-glow);
    }

    #bang-search:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .shortcut-hint {
      position: absolute;
      right: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      pointer-events: none;
      user-select: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 500;
      white-space: nowrap;
    }

    .keycap {
      min-width: 1.45rem;
      padding: 0.15rem 0.4rem;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      background: var(--surface-raised);
      color: var(--text);
      box-shadow: var(--shadow-sm);
      transition:
        background-color var(--transition),
        border-color var(--transition),
        color var(--transition),
        box-shadow var(--transition);
    }

    .keycap.is-pressed {
      background: var(--active-keycap);
      border-color: var(--active-keycap);
      color: #fff;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .stats {
      margin: 1.25rem 0 1rem;
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.01em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr));
      gap: 0.5rem;
    }

    .result {
      min-width: 0;
      overflow-wrap: anywhere;
      word-break: break-word;
      padding: 0.8rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      box-shadow: var(--shadow-sm);
      transition:
        border-color var(--transition),
        background-color var(--transition),
        box-shadow var(--transition);
    }

    .result:hover {
      border-color: color-mix(in srgb, var(--accent) 35%, var(--border));
      background: color-mix(in srgb, var(--accent) 6%, var(--surface));
      box-shadow: var(--shadow-md);
    }

    .alias {
      margin: 0 0 0.3rem;
      font-family: var(--font-mono);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
    }

    .name {
      margin: 0;
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--text);
    }

    .result-meta {
      display: block;
      margin-top: 0.35rem;
      font-size: 0.78rem;
      font-weight: 400;
      color: var(--text-muted);
    }

    .empty {
      padding: 1rem 1.125rem;
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 0.875rem;
      color: var(--text-muted);
      background: color-mix(in srgb, var(--surface) 86%, transparent);
    }

    @media (max-width: 520px) {
      #bang-search {
        padding-right: 1rem;
        padding-bottom: 2.6rem;
      }

      .shortcut-hint {
        left: 1.125rem;
        right: auto;
        bottom: 0.75rem;
      }
    }
    </style>
  </head>
  <body>
    <main>
      <header class="hero">
        <p class="eyebrow">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="10" />
            <path d="M4 12h16" />
            <path d="M12 4v16" />
          </svg>
          DuckDuckGo Bangs
        </p>
        <h1>Bang Search</h1>
        <p class="meta is-loading" id="meta">Loading bangs…</p>
      </header>

      <div class="search-shell">
        <label class="sr-only" for="bang-search">Search bangs</label>
        <input
          id="bang-search"
          data-primary-search
          type="search"
          placeholder="Search !g, Wikipedia, shopping, maps..."
          autocomplete="off"
          spellcheck="false"
        />
        <div class="shortcut-hint" aria-hidden="true">
          <span>Focus:</span>
          <kbd class="keycap" data-keycap="slash">/</kbd>
          <span>or</span>
          <kbd class="keycap" data-keycap="modifier">⌘</kbd>
          <kbd class="keycap" data-keycap="k">K</kbd>
        </div>
      </div>

      <p class="stats" id="stats"></p>

      <section class="grid" id="results" aria-live="polite"></section>
    </main>

    <script>
    const searchInput = document.querySelector('[data-primary-search]');
    const results = document.querySelector('#results');
    const stats = document.querySelector('#stats');
    const meta = document.querySelector('#meta');
    const modifierKeycap = document.querySelector("[data-keycap='modifier']");
    const slashKeycap = document.querySelector("[data-keycap='slash']");
    const kKeycap = document.querySelector("[data-keycap='k']");
    let allBangs = [];
    let categories = [];

    function isApplePlatform() {
      return (
        /Mac|iPhone|iPad|iPod/i.test(navigator.platform) ||
        (navigator.userAgent.includes('Mac') && 'ontouchend' in document)
      );
    }

    const platformModifier = isApplePlatform() ? 'metaKey' : 'ctrlKey';
    modifierKeycap.textContent = isApplePlatform() ? '⌘' : 'Ctrl';

    function isEditableTarget(target) {
      if (!(target instanceof HTMLElement)) {
        return false;
      }

      return Boolean(
        target.closest("input, textarea, select, [contenteditable=''], [contenteditable='true']")
      );
    }

    function setKeycapPressed(keycap, isPressed) {
      keycap.classList.toggle('is-pressed', isPressed);
    }

    function clearPressedKeycaps() {
      setKeycapPressed(slashKeycap, false);
      setKeycapPressed(modifierKeycap, false);
      setKeycapPressed(kKeycap, false);
    }

    function focusSearch(event, options = {}) {
      event.preventDefault();

      if (document.activeElement !== searchInput) {
        searchInput.focus({ preventScroll: true });
        searchInput.select();
      }

      window.setTimeout(() => {
        clearPressedKeycaps();
      }, options.clearDelay ?? 120);
    }

    function onShortcutKeyDown(event) {
      const key = event.key.toLowerCase();

      if (event.key === '/') {
        setKeycapPressed(slashKeycap, true);
      }

      if (event.metaKey || event.ctrlKey) {
        setKeycapPressed(modifierKeycap, true);
      }

      if (key === 'k') {
        setKeycapPressed(kKeycap, true);
      }
    }

    function onShortcutKeyUp(event) {
      const key = event.key.toLowerCase();

      if (event.key === '/') {
        setKeycapPressed(slashKeycap, false);
      }

      if (event.key === 'Meta' || event.key === 'Control') {
        setKeycapPressed(modifierKeycap, false);
        setKeycapPressed(kKeycap, false);
      }

      if (key === 'k') {
        setKeycapPressed(kKeycap, false);
      }
    }

    function createSearchShortcutHandler(input) {
      function onKeyDown(event) {
        const key = event.key.toLowerCase();

        if (document.activeElement === input && key === 'escape') {
          input.blur();
          clearPressedKeycaps();
          return;
        }

        if (!isEditableTarget(event.target)) {
          onShortcutKeyDown(event);
        }

        if (isEditableTarget(event.target)) {
          return;
        }

        if (event.key === '/') {
          focusSearch(event);
          return;
        }

        if (key === 'k' && event[platformModifier]) {
          setKeycapPressed(modifierKeycap, true);
          setKeycapPressed(kKeycap, true);

          event.preventDefault();

          requestAnimationFrame(() => {
            focusSearch(event);
          });
        }
      }

      function onKeyUp(event) {
        onShortcutKeyUp(event);
      }

      function onBlur() {
        clearPressedKeycaps();
      }

      window.addEventListener('keydown', onKeyDown);
      window.addEventListener('keyup', onKeyUp);
      window.addEventListener('blur', onBlur);

      return function cleanup() {
        window.removeEventListener('keydown', onKeyDown);
        window.removeEventListener('keyup', onKeyUp);
        window.removeEventListener('blur', onBlur);
      };
    }

    function normalizeBang([aliases, name, categoryIndex, popularity, template]) {
      const aliasList = Array.isArray(aliases) ? aliases : [aliases];

      return {
        aliases: aliasList,
        primaryAlias: aliasList[0] || '',
        name,
        category: categories[categoryIndex] || 'Uncategorized',
        popularity,
        template,
        searchable: [name, template, categories[categoryIndex] || '', ...aliasList]
          .join(' ')
          .toLowerCase()
      };
    }

    function scoreBang(bang, query) {
      if (!query) {
        return bang.popularity;
      }

      let score = bang.popularity / 1000;

      if (bang.primaryAlias.toLowerCase() === query) {
        score += 100000;
      }
      if (bang.aliases.some(alias => alias.toLowerCase() === query)) {
        score += 50000;
      }
      if (bang.name.toLowerCase() === query) {
        score += 25000;
      }
      if (bang.name.toLowerCase().includes(query)) {
        score += 4000;
      }
      if (bang.aliases.some(alias => alias.toLowerCase().includes(query))) {
        score += 3000;
      }
      if (bang.category.toLowerCase().includes(query)) {
        score += 400;
      }

      return score;
    }

    function render(items) {
      results.innerHTML = '';

      if (items.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'No bangs matched that search.';
        results.append(empty);
        stats.textContent = '0 results';
        return;
      }

      for (const bang of items.slice(0, 12)) {
        const article = document.createElement('article');
        article.className = 'result';

        const alias = document.createElement('p');
        alias.className = 'alias';
        alias.textContent = `!${bang.primaryAlias}`;

        const name = document.createElement('p');
        name.className = 'name';
        name.textContent = bang.name;

        const resultMeta = document.createElement('span');
        resultMeta.className = 'result-meta';
        resultMeta.textContent =
          `${bang.category} · ${bang.popularity.toLocaleString()} uses · ${bang.aliases.length} alias` +
          `${bang.aliases.length === 1 ? '' : 'es'}`;

        article.append(alias, name, resultMeta);
        results.append(article);
      }

      stats.textContent = `${Math.min(items.length, 12)} of ${items.length.toLocaleString()} results`;
    }

    function updateResults() {
      const query = searchInput.value.trim().toLowerCase().replace(/^!/, '');
      const filtered = query ? allBangs.filter(bang => bang.searchable.includes(query)) : allBangs;

      const sorted = [...filtered].sort((left, right) => {
        return scoreBang(right, query) - scoreBang(left, query);
      });

      render(sorted);
    }

    async function init() {
      results.innerHTML = '<div class="empty">Loading bangs…</div>';
      stats.textContent = '';

      const response = await fetch('./bangs.json');
      if (!response.ok) {
        throw new Error('Failed to load bangs.json');
      }

      const data = await response.json();
      categories = Array.isArray(data.c) ? data.c : [];
      allBangs = Array.isArray(data.b) ? data.b.map(normalizeBang) : [];
      meta.textContent = `${allBangs.length.toLocaleString()} searchable bangs`;
      meta.classList.remove('is-loading');
      updateResults();
    }

    searchInput.addEventListener('input', updateResults);
    createSearchShortcutHandler(searchInput);

    init().catch(() => {
      meta.textContent = 'Could not load bangs data.';
      meta.classList.remove('is-loading');
      stats.textContent = '';
      results.innerHTML = '<div class="empty">Could not load bangs data.</div>';
    });
    </script>
  </body>
</html>
